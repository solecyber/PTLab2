services:
  - type: web
    name: solecyber-ptlab2
    runtime: python
    plan: free
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: python -m pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && gunicorn tplab2.wsgi:application --bind "0.0.0.0:$PORT"
    healthCheckPath: /healthz/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
